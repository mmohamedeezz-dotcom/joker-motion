<!doctype html>
<!-- Joker Motion: the root. tools/make.mjs fills the duration; spec.js and timing.js are written per video. -->
<html lang="ar" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <script src="engine/core.js"></script>
    <script src="engine/scenes_1.js"></script>
    <script src="engine/scenes_2.js"></script>
    <script src="engine/scenes_3.js"></script>
    <script src="engine/scenes_icons.js"></script>
    <script src="icons.js"></script>
    <script src="spec.js"></script>
    <script src="timing.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #EFEDE8; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-fps="30" data-width="1080" data-height="1920">
      <div id="ad" data-composition-id="ad" data-composition-src="compositions/ad.html"
           data-start="0" data-duration="__DUR__" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <audio id="mix" class="clip" src="assets/mix.wav" data-start="0" data-duration="__DUR__" data-track-index="9" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
